<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D5237">
<meta name="robots" content="noindex,nofollow">
<title>Baker — PPF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --green:#0D5237; --green-deep:#083521;
  --gold:#D4B662; --gold-2:#F2E7A4;
  --ink:#FFFFFF; --ink-2:rgba(255,255,255,0.80); --ink-3:rgba(255,255,255,0.55);
  --line:rgba(255,255,255,0.12); --line-2:rgba(255,255,255,0.22);
  --panel:#0F3B29; --panel-2:#0a2d1f;
  --ok:#5fd58c; --warn:#f4c25f; --bad:#f47572;
  --display: 'Anton','Impact',sans-serif;
  --body: 'Inter',system-ui,sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--green); color: var(--ink); font: 15px/1.5 var(--body); min-height: 100dvh; overflow-x: hidden; }

/* Mobile tap baseline — see driver for rationale. */
button, [role="button"], input[type="button"], input[type="submit"] {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

/* Boot curtain — covers until /api/auth/me resolves */
.boot { position: fixed; inset: 0; display: grid; place-items: center; background: var(--green); color: var(--ink-3); font: 400 11px var(--display); letter-spacing: 0.2em; text-transform: uppercase; z-index: 100; }
.app { display: none; }
.app.is-ready { display: block; }

/* Dark banner at top */
.ops-banner {
  background: #000; color: var(--gold);
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  font: 400 11px var(--display);
  letter-spacing: 0.14em; text-transform: uppercase;
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  border-bottom: 1px solid var(--line);
}
.ops-banner .who { color: var(--ink-3); font-size: 10px; }

/* Primary header: logo + name + actions */
header.top { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
header.top .brand { font: 400 15px var(--display); letter-spacing: 0.12em; text-transform: uppercase; margin-right: auto; display: flex; align-items: center; gap: 10px; }
header.top .brand img { width: 36px; height: 32px; border-radius: 4px; }
header.top .brand small { display: block; font: 600 10px var(--body); letter-spacing: 0.16em; color: var(--ink-3); margin-top: 3px; }
header.top .action {
  font: 400 11px var(--display); letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink-2); padding: 8px 12px; border: 1px solid var(--line-2); border-radius: 999px;
  background: transparent; cursor: pointer;
  transition: transform 80ms ease, background 120ms ease, color 120ms ease, border-color 120ms ease;
}
header.top .action:hover { color: var(--gold); border-color: var(--gold); }
header.top .action:active { transform: scale(0.96); background: rgba(0,0,0,0.2); }

/* Tab bar */
nav.tabs { display: flex; gap: 2px; overflow-x: auto; overscroll-behavior-x: contain; padding: 0 10px; border-bottom: 1px solid var(--line); background: rgba(0,0,0,0.15); position: sticky; top: 0; z-index: 5; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button {
  flex: none; white-space: nowrap; background: transparent; border: 0;
  color: var(--ink-2); font: 400 13px var(--display); letter-spacing: 0.14em;
  text-transform: uppercase; padding: 14px 14px; cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: color 100ms ease, background 100ms ease;
}
nav.tabs button[aria-selected="true"] { color: var(--gold); border-bottom-color: var(--gold); }
nav.tabs button:active { background: rgba(0,0,0,0.25); color: var(--gold); }

/* Sections */
.wrap { max-width: 820px; margin: 0 auto; padding: 20px 16px 60px; }
section.view { display: none; }
section.view.is-active { display: block; }

/* Hero: today's date + totals */
.hero-date { font: 400 11px var(--display); letter-spacing: 0.22em; color: var(--gold); text-transform: uppercase; margin-bottom: 8px; }
.hero-h { font: 400 clamp(40px, 7vw, 60px) var(--display); line-height: 0.95; margin: 0 0 20px; letter-spacing: 0.01em; text-transform: uppercase; text-wrap: balance; }
.totals-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px; }
.totals-card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 12px; padding: 18px 20px;
}
.totals-card .lbl { font: 400 11px var(--display); letter-spacing: 0.18em; color: var(--ink-3); text-transform: uppercase; margin-bottom: 6px; }
.totals-card .num { font: 400 clamp(44px, 8vw, 64px) var(--display); line-height: 1; font-variant-numeric: tabular-nums; color: var(--gold); }
.totals-card .of-short { font: 600 11px var(--body); color: var(--warn); margin-top: 6px; letter-spacing: 0.04em; }

/* Shorts batch callout — only visible when today has shorts stops */
.shorts-batch {
  background: linear-gradient(135deg, rgba(244,194,95,0.14), rgba(244,194,95,0.04));
  border: 1px solid rgba(244,194,95,0.45);
  border-radius: 12px; padding: 16px 18px 14px;
  margin-bottom: 24px;
}
.shorts-batch .shorts-h {
  font: 400 13px var(--display); letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--warn); margin: 0 0 10px; display: flex; align-items: center; gap: 10px;
}
.shorts-batch .shorts-nums {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px;
}
.shorts-batch .shorts-num {
  background: rgba(0,0,0,0.25); border-radius: 10px; padding: 10px 12px;
}
.shorts-batch .shorts-num .lbl { font: 400 10px var(--display); letter-spacing: 0.16em; color: var(--ink-3); text-transform: uppercase; }
.shorts-batch .shorts-num .num { font: 400 32px var(--display); line-height: 1.1; color: var(--warn); font-variant-numeric: tabular-nums; }
.shorts-batch .shorts-stops { font-size: 13px; color: var(--ink-2); line-height: 1.5; }
.shorts-batch .shorts-stops b { color: var(--ink); font-weight: 700; }
.shorts-batch .shorts-bakery { font: 600 11px var(--body); letter-spacing: 0.04em; color: var(--ink-3); text-transform: uppercase; margin-top: 10px; padding-top: 10px; border-top: 1px dashed rgba(244,194,95,0.25); }
.shorts-batch .shorts-bakery b { color: var(--warn); font-weight: 700; }

/* Shorts tag on per-route destination cards */
.dest .shorts-tag {
  display: inline-block; font: 400 10px var(--display); letter-spacing: 0.14em;
  text-transform: uppercase; padding: 2px 8px; border-radius: 999px;
  border: 1px solid rgba(244,194,95,0.45); color: var(--warn);
  background: rgba(244,194,95,0.08); margin-left: 8px;
}
.dest-meta .shorts-line { color: var(--warn); margin-top: 2px; }

/* Destination table */
h2.sect { font: 400 13px var(--display); letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-3); margin: 28px 0 10px; }
.dest-grid { display: flex; flex-direction: column; gap: 10px; }
.dest {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 12px; padding: 16px 18px;
  display: grid; grid-template-columns: 1fr auto; gap: 10px 16px;
  align-items: start;
}
.dest-name { font: 400 20px var(--display); letter-spacing: 0.02em; text-transform: uppercase; }
.dest-meta { font-size: 13px; color: var(--ink-2); margin-top: 4px; line-height: 1.4; }
.dest-meta b { color: var(--ink); font-weight: 700; }
.dest-nums { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--display); font-size: 22px; line-height: 1.15; letter-spacing: 0.02em; }
.dest-nums small { display: block; font: 600 10px var(--body); letter-spacing: 0.14em; color: var(--ink-3); text-transform: uppercase; margin-top: 2px; }

/* Updates feed */
.upd { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
.upd-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; font: 400 10px var(--display); letter-spacing: 0.14em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--ink-2); }
.chip.ac { color: var(--gold); border-color: rgba(212,182,98,0.35); background: rgba(212,182,98,0.08); }
.chip.ok { color: var(--ok); border-color: rgba(95,213,140,0.35); background: rgba(95,213,140,0.08); }
.upd-title { font: 700 16px var(--body); line-height: 1.3; margin: 0; color: var(--ink); }
.upd-body { font-size: 14px; color: var(--ink-2); line-height: 1.55; margin: 0; }
.upd-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 2px; font-size: 12px; color: var(--ink-3); flex-wrap: wrap; }
.upd-ack-btn { font: 400 12px var(--display); letter-spacing: 0.14em; text-transform: uppercase; padding: 8px 14px; border: 1px solid var(--gold); color: var(--gold); background: transparent; border-radius: 999px; cursor: pointer; transition: transform 80ms ease, background 120ms ease, color 120ms ease; }
.upd-ack-btn:hover { background: var(--gold); color: #000; }
.upd-ack-btn:active:not(:disabled) { transform: scale(0.96); background: var(--gold-2); color: #000; }
.upd-ack-btn:disabled { cursor: default; color: var(--ok); border-color: rgba(95,213,140,0.4); background: rgba(95,213,140,0.08); }
.empty { color: var(--ink-3); font-size: 14px; text-align: center; padding: 32px 10px; }

/* Schedule grid */
.wk-nav { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
.wk-nav b { font: 400 14px var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); margin-right: auto; }
.wk-nav button { font: 400 11px var(--display); letter-spacing: 0.14em; text-transform: uppercase; padding: 7px 12px; border: 1px solid var(--line-2); color: var(--ink-2); background: transparent; border-radius: 999px; cursor: pointer; transition: transform 80ms ease, background 120ms ease; }
.wk-nav button:active { transform: scale(0.96); background: rgba(0,0,0,0.2); }
.wk-nav button[aria-pressed="true"] { background: var(--gold); color: #000; border-color: var(--gold); }
.sched-wrap { overflow-x: auto; overscroll-behavior-x: contain; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
table.sched { width: 100%; border-collapse: collapse; min-width: 540px; font-size: 13px; }
table.sched th, table.sched td { padding: 8px 8px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
table.sched th:first-child, table.sched td:first-child { text-align: left; padding-left: 14px; }
table.sched th { font: 400 11px var(--display); letter-spacing: 0.14em; color: var(--ink-3); text-transform: uppercase; }
table.sched th.today { color: var(--gold); border-bottom-color: var(--gold); }
table.sched td.on { background: rgba(95,213,140,0.1); font-weight: 700; color: var(--ok); font-size: 12px; }
table.sched td.off { background: rgba(244,117,114,0.1); color: var(--bad); font-size: 11px; font-weight: 700; }
table.sched td.cov { background: rgba(244,194,95,0.14); color: var(--warn); font-size: 11px; font-weight: 700; }
table.sched tr.group td { background: transparent; font: 400 10px var(--display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); padding-top: 14px; }
table.sched td b { color: var(--ink); font-weight: 700; }
table.sched td .sub { display: block; font: 500 11px var(--body); color: var(--ink-3); margin-top: 2px; }

/* Time off */
.form { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 18px; display: flex; flex-direction: column; gap: 14px; }
.form label { display: flex; flex-direction: column; gap: 5px; font: 400 11px var(--display); letter-spacing: 0.14em; color: var(--ink-3); text-transform: uppercase; }
.form input, .form select, .form textarea { font: 500 15px var(--body); padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line-2); background: #0a2d1f; color: var(--ink); }
.form textarea { min-height: 70px; resize: vertical; }
.form .err { color: var(--bad); font-size: 13px; margin: 0; min-height: 18px; }
.form button { background: var(--gold); color: #000; border: 0; padding: 12px 18px; border-radius: 10px; font: 400 13px var(--display); letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; transition: transform 80ms ease, background 120ms ease; }
.form button:hover { background: var(--gold-2); }
.form button:active:not(:disabled) { transform: scale(0.97); background: var(--gold-2); }
.form button:disabled { opacity: 0.5; cursor: not-allowed; }
.req { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; }
.req .d { font: 400 15px var(--display); letter-spacing: 0.04em; }
.req .meta { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.req .pill { font: 400 10px var(--display); letter-spacing: 0.14em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; border: 1px solid currentColor; }
.req .pending { color: var(--warn); }
.req .approved { color: var(--ok); }
.req .denied { color: var(--bad); }

/* Change PIN dialog */
dialog.pin-dlg {
  background: var(--panel); color: var(--ink); border: 1px solid var(--gold);
  border-radius: 14px; padding: 24px 24px 20px; width: min(360px, calc(100vw - 32px));
  box-shadow: 0 24px 64px -16px rgba(0,0,0,0.6); font-family: var(--body);
}
dialog.pin-dlg::backdrop { background: rgba(0,0,0,0.45); }
.pin-dlg h3 { font: 400 14px var(--display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); margin: 0 0 10px; }
.pin-dlg p { margin: 0 0 14px; font-size: 14px; color: var(--ink-2); }
.pin-dlg .err { color: var(--bad); font-size: 13px; min-height: 18px; margin: 0 0 10px; }
.pin-dlg input {
  font: 500 18px var(--body); padding: 12px 14px; border-radius: 8px;
  border: 1px solid var(--line-2); background: #0a2d1f; color: var(--ink);
  width: 100%; letter-spacing: 0.25em; text-align: center;
  touch-action: manipulation;
}
.pin-dlg .btns { display: flex; gap: 8px; margin-top: 14px; }
.pin-dlg .btns button { flex: 1; font: 400 13px var(--display); letter-spacing: 0.14em; text-transform: uppercase; padding: 11px 10px; border-radius: 10px; cursor: pointer; transition: transform 80ms ease, background 120ms ease; }
.pin-dlg .btns button:active { transform: scale(0.97); }
.pin-dlg .ghost { background: transparent; border: 1px solid var(--line-2); color: var(--ink-2); }
.pin-dlg .prim { background: var(--gold); color: #000; border: 0; }

footer { color: var(--ink-3); font-size: 11px; text-align: center; padding: 24px 10px; letter-spacing: 0.1em; }
</style>
</head>
<body>

<div class="boot" id="boot">Loading…</div>

<div class="app" id="app">
  <div class="ops-banner">
    <span>PPF Baker</span>
    <span class="who" id="who">—</span>
  </div>

  <header class="top">
    <div class="brand">
      <img src="/ppf-logo.jpg" alt="">
      <span>Baker<small>Philly Pretzel Factory</small></span>
    </div>
    <button class="action" type="button" id="change-pin">Change PIN</button>
    <button class="action" type="button" id="signout">Sign Out</button>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-v="today"    aria-selected="true">Today</button>
    <button role="tab" data-v="updates"  aria-selected="false">Updates</button>
    <button role="tab" data-v="schedule" aria-selected="false">Schedule</button>
    <button role="tab" data-v="off"      aria-selected="false">Time Off</button>
  </nav>

  <div class="wrap">
    <!-- Today -->
    <section class="view is-active" id="view-today">
      <div class="hero-date" id="today-date">—</div>
      <h1 class="hero-h">Today's bake</h1>
      <div class="totals-row">
        <div class="totals-card">
          <div class="lbl">Singles</div>
          <div class="num" id="t-singles">—</div>
          <div class="of-short" id="t-singles-short" hidden></div>
        </div>
        <div class="totals-card">
          <div class="lbl">Doubles</div>
          <div class="num" id="t-doubles">—</div>
          <div class="of-short" id="t-doubles-short" hidden></div>
        </div>
      </div>
      <div id="shorts-batch-wrap"></div>
      <h2 class="sect">By route</h2>
      <div class="dest-grid" id="dest-grid"><div class="empty">Loading…</div></div>
    </section>

    <!-- Updates -->
    <section class="view" id="view-updates">
      <h1 class="hero-h">What changed</h1>
      <div id="updates-list"><div class="empty">Loading…</div></div>
    </section>

    <!-- Schedule -->
    <section class="view" id="view-schedule">
      <h1 class="hero-h">Schedule</h1>
      <div class="wk-nav">
        <b id="week-label">—</b>
        <button type="button" data-w="0" aria-pressed="true">This week</button>
        <button type="button" data-w="1" aria-pressed="false">Next week</button>
      </div>
      <div class="sched-wrap"><table class="sched" id="sched-table"></table></div>
    </section>

    <!-- Time Off -->
    <section class="view" id="view-off">
      <h1 class="hero-h">Time off</h1>
      <form class="form" id="off-form" novalidate>
        <label>Day<input type="date" id="off-date" required></label>
        <label>What you need
          <select id="off-type">
            <option value="off">Day off (planned ahead)</option>
            <option value="cover">Coverage (can't make my shift)</option>
          </select>
        </label>
        <label>Note (optional)<input type="text" id="off-note" maxlength="200" placeholder="Doctor's appointment"></label>
        <p class="err" id="off-err">&nbsp;</p>
        <button type="submit" id="off-submit">Send request</button>
      </form>
      <h2 class="sect">My requests</h2>
      <div id="off-list"><div class="empty">Loading…</div></div>
    </section>

    <footer>Confidential · PPF Ops</footer>
  </div>
</div>

<!-- Change-PIN dialog, two-pass confirm -->
<dialog class="pin-dlg" id="pin-dlg" aria-labelledby="pin-dlg-h">
  <h3 id="pin-dlg-h">Change PIN</h3>
  <p id="pin-dlg-sub">Enter a new 4-digit PIN.</p>
  <p class="err" id="pin-dlg-err">&nbsp;</p>
  <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" id="pin-dlg-input" autocomplete="new-password">
  <div class="btns">
    <button type="button" class="ghost" id="pin-dlg-cancel">Cancel</button>
    <button type="button" class="prim" id="pin-dlg-save">Next</button>
  </div>
</dialog>

<script>
/* ─────────────────────────────────────────────────────────────
   BOOT — role gate (/api/auth/me). Non-bakers get bounced.
   ───────────────────────────────────────────────────────────── */
let _me = null;
const $ = s => document.querySelector(s);
const fmtDay = iso => {
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
};
const fmtDayLong = iso => {
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
};
const todayIso = () => {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
};
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);

async function boot() {
  const next = encodeURIComponent(location.pathname);
  try {
    const r = await fetch('/api/auth/me', { credentials: 'same-origin', cache: 'no-store' });
    if (!r.ok) { location.replace('/signin?next=' + next); return; }
    _me = await r.json();
    if (_me.role !== 'baker' && _me.role !== 'operator') {
      location.replace(_me.role === 'driver' ? '/driver' : '/signin');
      return;
    }
    $('#who').textContent = _me.name;
    $('#boot').style.display = 'none';
    $('#app').classList.add('is-ready');
    initApp();
  } catch (e) {
    location.replace('/signin?next=' + next);
  }
}

function initApp() {
  // Tab switching
  document.querySelectorAll('nav.tabs button').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('nav.tabs button').forEach(x => x.setAttribute('aria-selected', x === b));
      document.querySelectorAll('section.view').forEach(v => v.classList.toggle('is-active', v.id === 'view-' + b.dataset.v));
      if (b.dataset.v === 'updates')  loadUpdates();
      if (b.dataset.v === 'schedule') loadSchedule();
      if (b.dataset.v === 'off')      loadTimeOff();
    };
  });
  $('#signout').onclick = async () => {
    try { await fetch('/api/auth/me', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
    location.replace('/signin');
  };
  $('#change-pin').onclick = () => openPinDlg();
  bindOffForm();
  bindWkNav();
  bindPinDlg();
  loadToday();
}

/* ─────────────────────────────────────────────────────────────
   Today — bake totals + per-route breakdown
   ───────────────────────────────────────────────────────────── */
async function loadToday() {
  $('#today-date').textContent = fmtDayLong(todayIso());
  try {
    const r = await fetch('/api/baker/today', { credentials: 'same-origin', cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    $('#t-singles').textContent = j.totals.singles;
    $('#t-doubles').textContent = j.totals.doubles;
    const sShorts = j.totals.shorts_singles || 0;
    const dShorts = j.totals.shorts_doubles || 0;
    const ssEl = $('#t-singles-short');
    const dsEl = $('#t-doubles-short');
    if (sShorts) { ssEl.hidden = false; ssEl.textContent = `of which ${sShorts} short`; } else ssEl.hidden = true;
    if (dShorts) { dsEl.hidden = false; dsEl.textContent = `of which ${dShorts} short`; } else dsEl.hidden = true;

    // Shorts batch callout — grouped by bakery. Only renders if any
    // of today's active stops are flagged shorts.
    const bakeryShorts = j.bakery_shorts || {};
    const wrap = $('#shorts-batch-wrap');
    const bakeries = Object.keys(bakeryShorts);
    if (!bakeries.length) {
      wrap.innerHTML = '';
    } else {
      wrap.innerHTML = bakeries.map(bk => {
        const bs = bakeryShorts[bk];
        const routeNames = (bs.routes || []).join(' + ');
        // All shorts stops across these routes, flattened for display
        const stopNames = j.destinations
          .filter(d => bs.routes.includes(d.route_key))
          .flatMap(d => (d.shorts_stops || []).map(n => `${n} (${d.route_key})`))
          .join(', ');
        return `<div class="shorts-batch">
          <h2 class="shorts-h">SHORTS batch — ${esc(bk)}</h2>
          <div class="shorts-nums">
            <div class="shorts-num"><div class="lbl">Shorts singles</div><div class="num">${bs.singles}</div></div>
            <div class="shorts-num"><div class="lbl">Shorts doubles</div><div class="num">${bs.doubles}</div></div>
          </div>
          <div class="shorts-stops">Goes to: <b>${esc(stopNames) || '—'}</b></div>
          <div class="shorts-bakery">Pull short at <b>${esc(bk)}</b> · covers route(s): <b>${esc(routeNames)}</b></div>
        </div>`;
      }).join('');
    }

    $('#dest-grid').innerHTML = j.destinations.map(d => {
      const hasShorts = d.shorts_singles > 0 || d.shorts_doubles > 0;
      const tag = hasShorts
        ? `<span class="shorts-tag">${d.shorts_stops.length} shorts stop${d.shorts_stops.length === 1 ? '' : 's'}</span>`
        : '';
      const shortsLine = hasShorts
        ? `<div class="shorts-line">Shorts: <b>${d.shorts_singles} / ${d.shorts_doubles}</b> (baked at ${esc(d.bakery)})</div>`
        : '';
      return `<div class="dest">
        <div>
          <div class="dest-name">${esc(d.route_label)} route${tag}</div>
          <div class="dest-meta">
            Bakery: <b>${esc(d.bakery)}</b><br>
            Baker on: <b>${d.bakers.length ? d.bakers.map(esc).join(', ') : '—'}</b><br>
            Driver on: <b>${d.drivers.length ? d.drivers.map(esc).join(', ') : '—'}</b>
            ${shortsLine}
          </div>
        </div>
        <div class="dest-nums">
          ${d.singles} <small>singles</small>
          ${d.doubles} <small>doubles</small>
        </div>
      </div>`;
    }).join('');
  } catch (e) {
    $('#dest-grid').innerHTML = '<div class="empty">Could not load bake plan.</div>';
  }
}

/* ─────────────────────────────────────────────────────────────
   Updates feed with ack
   ───────────────────────────────────────────────────────────── */
async function loadUpdates() {
  try {
    const r = await fetch('/api/updates', { credentials: 'same-origin', cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const { updates } = await r.json();
    if (!updates.length) { $('#updates-list').innerHTML = '<div class="empty">No updates yet.</div>'; return; }
    $('#updates-list').innerHTML = updates.map(u => {
      const aud = u.audience.length === 0 ? 'All hands' : u.audience.map(a => a.charAt(0).toUpperCase() + a.slice(1)).join(' + ');
      const posted = new Date(u.posted_at).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
      const eff = u.effective_date ? ' · effective ' + fmtDay(u.effective_date) : '';
      const ackChip = u.requires_ack
        ? `<span class="chip ac">${u.ack_count} / ${u.ack_total} confirmed</span>`
        : '';
      const ackBtn = u.requires_ack
        ? (u.my_ack
            ? `<button class="upd-ack-btn" disabled>&check; Confirmed</button>`
            : `<button class="upd-ack-btn" data-ack="${u.id}">Got it</button>`)
        : '';
      return `<article class="upd">
        <div class="upd-head"><span class="chip">${esc(aud)}</span>${ackChip}</div>
        <h3 class="upd-title">${esc(u.title)}</h3>
        ${u.body ? `<p class="upd-body">${esc(u.body)}</p>` : ''}
        <div class="upd-foot"><span>Posted ${esc(posted)}${esc(eff)}</span>${ackBtn}</div>
      </article>`;
    }).join('');
    $('#updates-list').querySelectorAll('[data-ack]').forEach(b => {
      b.onclick = () => ackUpdate(b.dataset.ack, b);
    });
  } catch (e) {
    $('#updates-list').innerHTML = '<div class="empty">Could not load updates.</div>';
  }
}
async function ackUpdate(id, btn) {
  btn.disabled = true;
  try {
    const r = await fetch('/api/updates?action=ack', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ updateId: id }),
    });
    if (!r.ok) throw new Error(r.status);
    // Re-render the whole list to update the count server-side truth
    loadUpdates();
  } catch (e) {
    btn.disabled = false;
  }
}

/* ─────────────────────────────────────────────────────────────
   Schedule grid
   ───────────────────────────────────────────────────────────── */
let _weekOffset = 0;
function bindWkNav() {
  document.querySelectorAll('.wk-nav button').forEach(b => {
    b.onclick = () => {
      _weekOffset = parseInt(b.dataset.w, 10) || 0;
      document.querySelectorAll('.wk-nav button').forEach(x => x.setAttribute('aria-pressed', x === b));
      loadSchedule();
    };
  });
}
async function loadSchedule() {
  try {
    const r = await fetch('/api/schedule?week=' + _weekOffset, { credentials: 'same-origin', cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    $('#week-label').textContent = fmtDay(j.days[0].date) + ' – ' + fmtDay(j.days[6].date);

    const today = todayIso();
    const roles = [['baker','Bakers'], ['driver','Drivers']];
    const headCells = ['<th>Who</th>'].concat(j.days.map(d => {
      const isToday = d.date === today;
      return `<th class="${isToday ? 'today' : ''}">${esc(d.weekday)}<div class="sub">${d.date.slice(5).replace('-','/')}</div></th>`;
    })).join('');
    const groups = roles.map(([role, label]) => {
      const peeps = j.people.filter(p => p.role === role);
      if (!peeps.length) return '';
      const rows = peeps.map(p => {
        const myShifts = j.shifts.filter(s => s.person_id === p.id);
        const myOff = j.timeOff.filter(o => o.person_id === p.id);
        const cells = j.days.map(d => {
          const shift = myShifts.find(s => (s.days || []).includes(d.dow));
          if (!shift) return '<td></td>';
          const approvedOff = myOff.find(o => o.requested_date === d.date && o.status === 'approved');
          if (approvedOff) {
            if (approvedOff.cover?.name) {
              return `<td class="cov">${esc(approvedOff.cover.name)}<div class="sub">covering</div></td>`;
            }
            return `<td class="off">Off</td>`;
          }
          const pending = myOff.find(o => o.requested_date === d.date && o.status === 'pending');
          const loc = (shift.location || '').replace(' bakery',' bake').replace(' route','');
          return `<td class="on"><b>${esc(shift.route_key || 'Bake')}</b><div class="sub">${esc(loc)}${pending ? ' · asked off' : ''}</div></td>`;
        }).join('');
        return `<tr><td><b>${esc(p.name)}</b></td>${cells}</tr>`;
      }).join('');
      return `<tr class="group"><td colspan="8">${label}</td></tr>` + rows;
    }).join('');
    $('#sched-table').innerHTML = `<thead><tr>${headCells}</tr></thead><tbody>${groups}</tbody>`;
  } catch (e) {
    $('#sched-table').innerHTML = '<tbody><tr><td class="empty">Could not load schedule.</td></tr></tbody>';
  }
}

/* ─────────────────────────────────────────────────────────────
   Time off
   ───────────────────────────────────────────────────────────── */
function bindOffForm() {
  const f = $('#off-form');
  $('#off-date').value = (() => { const d = new Date(); d.setDate(d.getDate() + 1); return d.toISOString().slice(0,10); })();
  f.onsubmit = async (e) => {
    e.preventDefault();
    const payload = {
      requestedDate: $('#off-date').value,
      type: $('#off-type').value,
      note: $('#off-note').value.trim(),
    };
    $('#off-err').textContent = ' ';
    $('#off-submit').disabled = true;
    try {
      const r = await fetch('/api/time-off', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify(payload),
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) {
        $('#off-err').textContent = j.error || 'could not send';
        $('#off-submit').disabled = false;
        return;
      }
      $('#off-note').value = '';
      $('#off-submit').disabled = false;
      loadTimeOff();
    } catch (e) {
      $('#off-err').textContent = 'network error';
      $('#off-submit').disabled = false;
    }
  };
}
async function loadTimeOff() {
  try {
    const r = await fetch('/api/time-off', { credentials: 'same-origin', cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const { requests } = await r.json();
    if (!requests.length) { $('#off-list').innerHTML = '<div class="empty">No requests yet.</div>'; return; }
    $('#off-list').innerHTML = requests.map(q => {
      const cls = q.status === 'approved' ? 'approved' : q.status === 'denied' ? 'denied' : 'pending';
      const label = q.status === 'approved' ? 'Approved' : q.status === 'denied' ? 'Denied' : 'Pending';
      const typeTxt = q.type === 'off' ? 'Day off' : 'Needs coverage';
      const cover = q.cover?.name ? ' · covered by ' + esc(q.cover.name) : '';
      return `<div class="req">
        <div>
          <div class="d">${esc(fmtDay(q.requested_date))}</div>
          <div class="meta">${esc(typeTxt)}${esc(q.note ? ' · ' + q.note : '')}${cover}</div>
        </div>
        <span class="pill ${cls}">${label}</span>
      </div>`;
    }).join('');
  } catch (e) {
    $('#off-list').innerHTML = '<div class="empty">Could not load requests.</div>';
  }
}

/* ─────────────────────────────────────────────────────────────
   Change-PIN dialog — two-pass confirm, uses /api/auth/change-pin
   ───────────────────────────────────────────────────────────── */
const pinDlg = { phase: 'enter', first: '', open: false };
function openPinDlg() {
  pinDlg.phase = 'enter'; pinDlg.first = '';
  $('#pin-dlg-sub').textContent = 'Enter a new 4-digit PIN.';
  $('#pin-dlg-err').textContent = ' ';
  $('#pin-dlg-input').value = '';
  $('#pin-dlg-save').textContent = 'Next';
  $('#pin-dlg').showModal();
  setTimeout(() => $('#pin-dlg-input').focus(), 0);
}
function bindPinDlg() {
  const dlg = $('#pin-dlg');
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
  $('#pin-dlg-cancel').onclick = () => dlg.close();
  $('#pin-dlg-input').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('#pin-dlg-save').click(); } });
  $('#pin-dlg-save').onclick = async () => {
    const v = $('#pin-dlg-input').value.trim();
    if (!/^\d{4,6}$/.test(v)) { $('#pin-dlg-err').textContent = 'PIN must be 4-6 digits.'; return; }
    if (v === '0000')         { $('#pin-dlg-err').textContent = 'PIN cannot be 0000.'; return; }
    $('#pin-dlg-err').textContent = ' ';

    if (pinDlg.phase === 'enter') {
      pinDlg.first = v; pinDlg.phase = 'confirm';
      $('#pin-dlg-sub').textContent = 'Enter it again to confirm.';
      $('#pin-dlg-input').value = '';
      $('#pin-dlg-save').textContent = 'Save';
      $('#pin-dlg-input').focus();
      return;
    }
    if (v !== pinDlg.first) {
      $('#pin-dlg-err').textContent = 'PINs didn’t match. Start over.';
      pinDlg.phase = 'enter'; pinDlg.first = '';
      $('#pin-dlg-sub').textContent = 'Enter a new 4-digit PIN.';
      $('#pin-dlg-input').value = '';
      $('#pin-dlg-save').textContent = 'Next';
      return;
    }
    try {
      const r = await fetch('/api/auth/change-pin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ newPin: v }),
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) {
        $('#pin-dlg-err').textContent = j.error || 'could not save';
        pinDlg.phase = 'enter'; pinDlg.first = '';
        $('#pin-dlg-input').value = '';
        $('#pin-dlg-save').textContent = 'Next';
        return;
      }
      $('#pin-dlg').close();
    } catch (e) {
      $('#pin-dlg-err').textContent = 'network error';
    }
  };
}

boot();
</script>
