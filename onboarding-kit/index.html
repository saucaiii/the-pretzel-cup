<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Store Onboarding Kit — PPF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root { --green:#0D5237; --gold:#D4B662; color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #f3efe4; color: #111; font-family: 'Inter', system-ui, sans-serif; }
  .toolbar {
    background: var(--green); color: #fff;
    padding: 14px 24px;
    display: flex; justify-content: space-between; align-items: center;
    box-shadow: 0 2px 10px rgba(0,0,0,.15);
  }
  .toolbar .title { font-family: 'Anton', sans-serif; font-size: 20px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
  .toolbar .sub { font-size: 12px; color: rgba(255,255,255,.7); letter-spacing: .1em; text-transform: uppercase; }
  .wrap { max-width: 920px; margin: 32px auto; padding: 0 24px; }
  h1 { font-family: 'Anton', sans-serif; font-weight: 400; font-size: 36px; letter-spacing: .02em; margin: 0 0 6px; text-transform: uppercase; color: var(--green); }
  .lede { color: #555; font-size: 14px; margin: 0 0 28px; }
  .lede b { color: #111; }
  .group { margin-bottom: 28px; }
  .group h2 { font-family: 'Anton', sans-serif; font-size: 14px; letter-spacing: .22em; text-transform: uppercase; color: var(--green); margin: 0 0 10px; }
  .stops { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .stop {
    display: flex; justify-content: space-between; align-items: center; gap: 14px;
    background: #fff; border: 1px solid #e9e3cf;
    padding: 12px 16px; border-radius: 10px; text-decoration: none; color: inherit;
    transition: background 120ms ease, border-color 120ms ease, transform 80ms ease;
  }
  .stop:hover { background: #faf4e1; border-color: var(--gold); }
  .stop:active { transform: scale(.995); }
  .stop .name { font-weight: 600; color: #111; }
  .stop .code { color: var(--green); font-family: 'Anton', sans-serif; letter-spacing: .1em; font-size: 13px; }
  .stop .url { color: #777; font-size: 12px; font-family: 'Anton', sans-serif; letter-spacing: .08em; margin-top: 2px; }
  .stop .download {
    background: var(--green); color: var(--gold); border-radius: 999px;
    padding: 6px 14px; font: 700 11px 'Anton', sans-serif; letter-spacing: .14em; text-transform: uppercase;
    white-space: nowrap;
  }
  .stop:hover .download { background: var(--gold); color: #000; }
  .loading { color: #777; padding: 24px; text-align: center; }
  @media (min-width: 720px) {
    .stops { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <div>
    <div class="title">Store Onboarding Kits</div>
    <div class="sub">PPF · Pretzel Cup</div>
  </div>
</div>

<main class="wrap">
  <h1>Pick a store</h1>
  <p class="lede">Each store has a <b>pre-rendered 7-page PDF bundle</b> ready to download and print: welcome letter, driver card, contact card w/ QR, UPC card, basket stand insert, barcode strips, pricing card.</p>
  <div id="groups" class="loading">Loading stores…</div>
</main>

<script>
const ROUTE_ORDER = ['FSQ', 'LYN', 'FBW'];
const ROUTE_LABELS = { FSQ: 'Franklin Square', LYN: 'Lynbrook', FBW: 'Freeport / Baldwin' };
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

(async () => {
  const r = await fetch('/api/store?resource=stops', { cache: 'no-store' });
  const j = await r.json();
  if (!r.ok || !Array.isArray(j.stops)) { document.getElementById('groups').textContent = 'Could not load stores.'; return; }
  const byRoute = {};
  for (const s of j.stops) (byRoute[s.route_key] ||= []).push(s);
  const html = ROUTE_ORDER.filter(k => byRoute[k]).map(k => `
    <section class="group">
      <h2>${esc(ROUTE_LABELS[k] || k)} — ${byRoute[k].length} store${byRoute[k].length===1?'':'s'}</h2>
      <div class="stops">
        ${byRoute[k].map(s => {
          const code = (s.slug || '').toUpperCase();
          const name = s.display_name || code;
          const pdfHref = `/onboarding-kit/pdfs/${encodeURIComponent(code)}.pdf`;
          return `<a class="stop" href="${esc(pdfHref)}" target="_blank" rel="noopener">
                    <div>
                      <div class="name">${esc(name)}</div>
                      <div class="url">${esc(code)}.pdf · 7 pages</div>
                    </div>
                    <span class="download">Download kit →</span>
                  </a>`;
        }).join('')}
      </div>
    </section>
  `).join('');
  document.getElementById('groups').outerHTML = html;
})();
</script>
</body>
</html>
