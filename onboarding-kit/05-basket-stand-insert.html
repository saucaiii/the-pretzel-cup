<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Basket Stand Insert — The Pretzel Cup</title>
<base href="/onboarding-kit/" />
<link rel="stylesheet" href="assets/kit.css" />
<style>
  @page { size: 6in 4in; margin: 0; }
  html, body { width: 6in; height: 4in; margin: 0; padding: 0; }
  .insert {
    width: 6in;
    height: 4in;
    background-image: url('assets/basket-card-2.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    position: relative;
  }
  /* Optional: tiny Pretzel Cup credit, bottom-right corner, discreet */
  .credit {
    position: absolute;
    bottom: 6px;
    right: 10px;
    font-family: 'Caveat', cursive;
    font-size: 14px;
    color: var(--ppf-gold);
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
<div class="insert">
  <div class="credit">delivered fresh by The Pretzel Cup</div>
</div>
</body>
</html>
