<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<title>Store Kit — PPF Onboarding</title>
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { background:#0D5237; color:#D4B662; font-family:system-ui,sans-serif;
    min-height:100vh; margin:0; display:grid; place-items:center; text-align:center; padding:24px; }
  a { color:#F2E7A4; }
</style>
</head>
<body>
<div>
  <p>Opening the kit PDF…</p>
  <p id="fallback" style="display:none;">
    If it doesn't open, <a id="link" href="/onboarding-kit">pick a store →</a>
  </p>
</div>
<script>
const code = String(new URLSearchParams(location.search).get('store') || '')
  .toUpperCase().replace(/[^A-Z0-9]/g, '');
if (code) {
  const href = `/onboarding-kit/pdfs/${encodeURIComponent(code)}.pdf`;
  document.getElementById('link').href = href;
  location.replace(href);
} else {
  document.getElementById('fallback').style.display = '';
}
setTimeout(() => { document.getElementById('fallback').style.display = ''; }, 1500);
</script>
</body>
</html>
