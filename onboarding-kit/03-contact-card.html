<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Contact Card — The Pretzel Cup</title>
<base href="/onboarding-kit/" />
<link rel="stylesheet" href="assets/kit.css" />
<style>
  @page { size: 6in 4in; margin: 0; }
  body { width: 6in; height: 4in; }
  .card { width: 6in; height: 4in; display: grid; grid-template-columns: 1fr 1fr; position: relative; }
  .left {
    padding: 32px 28px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .right {
    background: var(--ppf-cream);
    color: var(--ppf-ink);
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .eyebrow { color: var(--ppf-gold); margin-bottom: 8px; }
  .headline {
    font-family: 'Archivo Black', sans-serif;
    font-weight: 700;
    font-size: 36px;
    line-height: 0.95;
    text-transform: uppercase;
    margin: 0;
  }
  .script-sub {
    font-family: 'Caveat', cursive;
    color: var(--ppf-gold);
    font-size: 26px;
    display: block;
    margin-top: 4px;
    line-height: 1;
  }
  .steps {
    margin: 18px 0 0;
    padding: 0;
    list-style: none;
    counter-reset: step;
    font-size: 12px;
    line-height: 1.5;
  }
  .steps li {
    counter-increment: step;
    padding-left: 26px;
    position: relative;
    margin-bottom: 8px;
  }
  .steps li::before {
    content: counter(step);
    position: absolute;
    left: 0; top: 0;
    width: 18px; height: 18px;
    background: var(--ppf-gold);
    color: var(--ppf-green-deep);
    font-family: 'Archivo Black', sans-serif;
    font-weight: 700;
    font-size: 11px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .qr-box {
    width: 160px;
    height: 160px;
    background: var(--ppf-white);
    padding: 10px;
    border: 2px solid var(--ppf-green);
    border-radius: 4px;
  }
  .qr-box img { width: 100%; height: 100%; display: block; }
  .scan-label {
    font-family: 'Archivo Black', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 12px;
    color: var(--ppf-green);
  }
  .portal-url {
    font-size: 10px;
    letter-spacing: 0.06em;
    color: var(--ppf-ink);
    margin-top: 4px;
    opacity: 0.75;
    word-break: break-all;
  }
</style>
</head>
<body>
<div class="card">
  <div class="left">
    <div class="plate-strip" style="position:absolute; top:0; left:0; right:50%; height:28px;"></div>
    <div class="eyebrow" style="margin-top: 20px;">Need to reach Chris?</div>
    <h1 class="headline">All comms<br/>run through<br/><span class="script-sub">the portal</span></h1>
    <ol class="steps">
      <li>Scan the QR to open your portal</li>
      <li>Message Chris directly from there</li>
      <li>He's notified immediately — day or night</li>
    </ol>
  </div>
  <div class="right">
    <div class="qr-box">
      <img id="qr-img" alt="Portal QR code" />
    </div>
    <div class="scan-label">Scan to open portal</div>
    <div class="portal-url" id="portal-url"></div>
  </div>
</div>
<script>
// Per-store QR: /onboarding-kit/03-contact-card?store=FSQ07 encodes
// https://the-pretzel-cup.vercel.app/store/FSQ07 (which the vercel.json
// rewrite sends to /store/signin?slug=FSQ07, skipping the picker).
// Without ?store=…, the QR goes to the generic signin page.
(function () {
  const raw = new URLSearchParams(location.search).get('store') || '';
  const slug = raw.toUpperCase().replace(/[^A-Z0-9]/g, '');
  const target = slug
    ? 'https://the-pretzel-cup.vercel.app/store/' + slug
    : 'https://the-pretzel-cup.vercel.app/store/signin';
  const display = target.replace(/^https?:\/\//, '');
  document.getElementById('qr-img').src =
    'https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=0&data=' +
    encodeURIComponent(target);
  document.getElementById('portal-url').textContent = display;
})();
</script>
</body>
</html>
